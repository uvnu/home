<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väder i Sverige</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4">

    <h1 class="mb-4 text-center">Väder och UV-index i Sverige</h1>

    <!-- City Search -->
    <div class="input-group mb-4">
      <input type="text" id="cityInput" class="form-control" placeholder="Ange stad, t.ex. Stockholm">
      <button class="btn btn-primary" id="searchBtn">Sök</button>
    </div>

    <!-- Weather Cards -->
    <div class="row" id="weatherCards">

      <!-- UV Card -->
      <div class="col-md-6 mb-3">
        <div class="card text-white bg-warning h-100" id="uvCard">
          <div class="card-body">
            <h5 class="card-title">UV-index</h5>
            <p class="card-text fs-1" id="uvValue">--</p>
            <p class="card-text" id="uvAdvice">Ladda ner skydd mot solen!</p>
          </div>
        </div>
      </div>

      <!-- Temperature/Weather Card -->
      <div class="col-md-6 mb-3">
        <div class="card h-100" id="tempCard">
          <div class="card-body">
            <h5 class="card-title">Väder</h5>
            <p class="card-text fs-1" id="temperature">-- °C</p>
            <p class="card-text" id="weatherDesc">--</p>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
