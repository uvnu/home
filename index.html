<!-- index.html (complete) -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UV.nu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --glass-bg: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.18);
      --text-dim: rgba(255,255,255,.72);
    }
    body{
      min-height: 100vh;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 700px at 20% 10%, rgba(90,140,255,.55), transparent 60%),
                  radial-gradient(900px 600px at 80% 20%, rgba(190,90,255,.45), transparent 55%),
                  radial-gradient(1000px 700px at 50% 110%, rgba(40,180,255,.25), transparent 55%),
                  #0b1020;
    }
    .glass{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
    }
    .dim{ color: var(--text-dim); }
    .uv-big{
      font-size: clamp(56px, 10vw, 92px);
      line-height: 1;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .pill{
      border-radius: 999px;
      padding: .35rem .7rem;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      font-size: .9rem;
      white-space: nowrap;
    }
    .mini-card{ min-width: 110px; border-radius: 18px; }
    .input-glass{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      color:#fff;
    }
    .input-glass::placeholder{ color: rgba(255,255,255,.55); }
    .btn-glass{
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      color:#fff;
    }
    .btn-glass:hover{ background: rgba(255,255,255,.16); color:#fff; }
    .error{ color: rgba(255,180,180,.95); }
  </style>
</head>

<body>
  <main class="container py-4 py-md-5" style="max-width: 980px;">
    <!-- Header -->
    <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
      <div>
        <div class="h4 mb-1" id="locationName">Hämtar plats…</div>
        <div class="small dim" id="updatedAt">—</div>
      </div>

      <div class="d-flex gap-2 align-items-center">
        <div class="d-none d-md-block" style="width: 320px;">
          <input id="cityInput" class="form-control input-glass" placeholder="Byt plats (t.ex. Uppsala)" />
        </div>
        <button id="useMyLocationBtn" class="btn btn-glass" type="button">Min plats</button>
      </div>
    </div>

    <div class="d-md-none mb-3">
      <input id="cityInputMobile" class="form-control input-glass" placeholder="Byt plats (t.ex. Uppsala)" />
      <div class="small dim mt-2">Tips: skriv en stad och tryck Enter</div>
    </div>

    <div id="status" class="small dim mb-3"></div>

    <!-- Top row: two cards -->
    <div class="row g-3 mb-3">
      <!-- UV now -->
      <div class="col-12 col-lg-8">
        <section class="glass p-4 p-md-5 h-100">
          <div class="small dim mb-2">UV-index nu</div>
          <div class="uv-big" id="uvNow">—</div>
          <div class="mt-2 d-flex gap-2 flex-wrap">
            <span class="pill" id="uvLevel">—</span>
            <span class="pill dim" id="uvHint">—</span>
          </div>
        </section>
      </div>

      <!-- Peak today -->
      <div class="col-12 col-lg-4">
        <section class="glass p-4 p-md-5 h-100">
          <div class="small dim mb-2">Topp idag</div>
          <div class="display-5 fw-semibold mb-1" id="uvMax">—</div>
          <div class="dim mb-3" id="uvMaxTime">—</div>
          <div class="small dim" id="uvMaxBand"></div>
        </section>
      </div>
    </div>

    <!-- Middle row: narrative + recommendation list -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <div class="glass p-4 h-100">
          <div class="small dim mb-2">UV-index idag</div>
          <div class="h5 mb-2" id="todayNarrativeTitle">—</div>
          <div class="dim" id="todayNarrativeBody">—</div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="glass p-4 h-100">
          <div class="small dim mb-2">Rekommendation</div>
          <ul class="mb-0 dim" id="recList" style="padding-left: 1.1rem;">
            <li>—</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <section class="glass p-3 p-md-4">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <div class="small dim">Prognos</div>
        <div class="small dim" id="forecastModeLabel">Kommande timmar</div>
      </div>

      <div class="small dim mb-2" id="forecastSummary"></div>

      <div id="forecastStrip" class="d-flex gap-2 overflow-auto pb-1"></div>
    </section>

    <div class="mt-4 small dim">
      Källa: Open-Meteo • UV-index kan variera lokalt
    </div>

    <div id="error" class="mt-3 small error"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
