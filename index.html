<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV.nu</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .uv-low { background-color: #a3f7a3; }       /* Green */
    .uv-moderate { background-color: #fff3a3; }  /* Yellow */
    .uv-high { background-color: #ffb3a3; }      /* Red */
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">UV.nu</h1>
    <nav>
      <ul class="flex space-x-4">
        <li><a href="#home" class="hover:underline">Hem</a></li>
        <li><a href="#uv-index" class="hover:underline">UV-index</a></li>
        <li><a href="#tips" class="hover:underline">Tips</a></li>
        <li><a href="#kontakt" class="hover:underline">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="home" class="bg-blue-100 p-8 text-center">
    <h2 class="text-3xl font-bold mb-4">Håll koll på UV-strålningen!</h2>
    <p class="mb-6">Få dagens UV-index och tips för solskydd direkt här.</p>
    <button class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Se UV-index</button>
  </section>

  <!-- UV & Weather Section -->
  <section id="uv-index" class="p-8 grid grid-cols-1 md:grid-cols-3 gap-6" id="cities">
    <!-- Cards populated dynamically -->
  </section>

  <!-- Tips Section -->
  <section id="tips" class="bg-yellow-100 p-8">
    <h2 class="text-2xl font-bold mb-4">Solskyddstips</h2>
    <ul id="tips-list" class="list-disc pl-5 space-y-2">
      <!-- Tips populated dynamically -->
    </ul>
  </section>

  <!-- Contact Section -->
  <section id="kontakt" class="p-8 text-center">
    <h2 class="text-2xl font-bold mb-4">Kontakt</h2>
    <p>Frågor? Maila oss på <a href="mailto:info@uv.nu" class="text-blue-600 hover:underline">info@uv.nu</a></p>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white p-4 text-center">
    <p>&copy; 2026 UV.nu. Alla rättigheter reserverade.</p>
  </footer>

  <!-- JS for live weather & UV with dynamic tips -->
  <script>
    const apiKey = 'eb45ab32159d3a2bb8369a2dfc5be8bb';
    const cities = [
      { name: 'Stockholm', lat: 59.3293, lon: 18.0686 },
      { name: 'Göteborg', lat: 57.7089, lon: 11.9746 },
      { name: 'Malmö', lat: 55.6050, lon: 13.0038 }
    ];

    function getUVClass(uv) {
      if (uv <= 2) return 'uv-low';
      if (uv <= 5) return 'uv-moderate';
      return 'uv-high';
    }

    function getTips(uv) {
      if (uv <= 2) return ['Låg UV-risk, solkräm valfritt.', 'Bär solglasögon om du vill.'];
      if (uv <= 5) return ['Moderat UV-risk, använd solkräm SPF 30.', 'Undvik solen mitt på dagen.'];
      return ['Hög UV-risk, använd solkräm SPF 50+', 'Täck huden och använd hatt.', 'Sök skugga mellan 11-15.'];
    }

    async function fetchCityData(city) {
      const weatherRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=metric&appid=${apiKey}&lang=sv`);
      const weatherData = await weatherRes.json();
      
      const uvRes = await fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=${city.lat}&lon=${city.lon}&appid=${apiKey}`);
      const uvData = await uvRes.json();

      return {
        name: city.name,
        temp: weatherData.main.temp.toFixed(1),
        weather: weatherData.weather[0].description,
        icon: `http://openweathermap.org/img/wn/${weatherData.weather[0].icon}@2x.png`,
        uv: uvData.value
      };
    }

    async function renderCities() {
      const container = document.getElementById('cities');
      const tipsList = document.getElementById('tips-list');
      container.innerHTML = '';
      tipsList.innerHTML = '';

      for (let city of cities) {
        const data = await fetchCityData(city);
        
        // Create UV/weather card
        const card = document.createElement('div');
        card.className = `shadow p-4 rounded text-center ${getUVClass(data.uv)}`;
        card.innerHTML = `
          <h3 class="font-bold mb-2">${data.name}</h3>
          <img src="${data.icon}" alt="${data.weather}" class="mx-auto">
          <p class="text-xl font-semibold">${data.temp}°C</p>
          <p class="capitalize mb-2">${data.weather}</p>
          <p class="text-2xl font-bold">UV: ${data.uv}</p>
        `;
        container.appendChild(card);

        // Add tips dynamically
        const cityTips = getTips(data.uv);
        cityTips.forEach(tip => {
          const li = document.createElement('li');
          li.textContent = `${data.name}: ${tip}`;
          tipsList.appendChild(li);
        });
      }
    }

    renderCities();
  </script>

</body>
</html>
